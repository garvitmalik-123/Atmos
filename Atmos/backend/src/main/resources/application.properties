server.port=${PORT:5000}

# GNews (https://gnews.io) key — swapped from NewsAPI since NewsAPI's free
# tier (100 req/day, dev-only) kept getting exhausted. GNews free tier is
# 100 req/day too, but no dev/production restriction and no daily-quota
# surprises tied to a single shared demo key.
news.api.key=${NEWS_API_KEY:7c91d28f96c4f69eb2defccb3645b889}

# OpenWeatherMap (https://openweathermap.org) key
weather.api.key=${WEATHER_API_KEY:59f6b1360b1b69e1d5cde17d7bcc6afd}

logging.level.com.atmos.backend=INFO

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.packages-to-scan=com.atmos.backend